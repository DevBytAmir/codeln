[package]
name = "codeln"
version = "1.0.0"
edition = "2024"
authors = ["DevBytAmir"]
description = "A professional source code line counter with advanced filtering"
license = "MIT"
readme = "README.md"
repository = "https://github.com/DevBytAmir/codeln"
homepage = "https://github.com/DevBytAmir/codeln"
keywords = ["cli", "line-counter", "cloc", "code-metrics"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
toml = "0.9"
walkdir = "2.5"
colored = "2.1"
csv = "1.3"

[[bin]]
name = "codeln"
path = "src/main.rs"